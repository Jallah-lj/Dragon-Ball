# Local production-like stack: PostgreSQL, Redis and the app.
#   docker compose up --build
#   docker compose run --rm app node apps/server/dist/seed.js   # optional demo data
# Then open http://localhost:3001
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbfc_dev_password}
      POSTGRES_DB: dbfc
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dbfc -d dbfc']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      DATABASE_URL: postgres://dbfc:${POSTGRES_PASSWORD:-dbfc_dev_password}@postgres:5432/dbfc
      REDIS_URL: redis://redis:6379
      AUTO_MIGRATE: 'true'
      # Required in production — set a long random value in your shell or .env.
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (e.g. openssl rand -hex 32)}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Forest Chase <no-reply@example.com>}
    ports:
      - '3001:3001'

volumes:
  pgdata:
  redisdata:
