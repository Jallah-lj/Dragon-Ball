name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (shared rules, fairness sweep, web)
        run: npm run test:unit
        env:
          FAIRNESS_SEEDS: '6'
      - run: npm run build

  integration:
    name: Server integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integration tests on embedded PGlite
        run: npm run test:integration
      - name: Integration tests on PostgreSQL 16 + Redis 7
        run: npm run test:integration
        env:
          TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379/1
      - name: Migrations and seed against PostgreSQL
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SEED_PASSWORD: ci-demo-password

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
